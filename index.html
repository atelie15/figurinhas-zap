<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateliê15 | Receba a sua mensagem do dia no WhatsApp</title>
<meta name="description" content="Escolha um tema, envie uma mensagem para o WhatsApp do Ateliê15 e receba a sua mensagem do dia.">
<meta name="theme-color" content="#2F5BFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16171A; --muted:#5B6270; --cream:#FFF6DC; --blue:#2F5BFF; --blue-2:#6C8CFF; --blue-dark:#1B3FD1;
  --pop:#FF4B3E; --gold:#FFC62E; --pink:#FF8AC4; --mint:#7EE0B5; --sky:#8FD3FF; --orange:#FFA94D; --wa:#1FAF52;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}
body{
  margin:0; min-height:100vh; color:var(--ink); background:var(--cream);
  font-family:'DM Sans', system-ui, sans-serif; line-height:1.5;
  background-image:radial-gradient(rgba(22,23,26,.07) 1.5px, transparent 1.5px); background-size:22px 22px;
}

/* ===== HERO ===== */
.hero{
  position:relative; overflow:hidden; text-align:center; color:#fff;
  background:
    repeating-conic-gradient(from 0deg at 50% 120%, rgba(255,255,255,.10) 0 8deg, transparent 8deg 16deg),
    linear-gradient(160deg,var(--blue) 0%, #5A3FFF 100%);
  padding:18px 20px 62px;
}
.hero::after{
  content:""; position:absolute; left:-5%; right:-5%; bottom:-1px; height:34px;
  background:var(--cream); border-radius:50% 50% 0 0 / 100% 100% 0 0;
}
.hero-brand{
  display:inline-block; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:20px; letter-spacing:.02em;
  background:#fff; color:var(--blue-dark); padding:4px 16px; border-radius:999px;
  box-shadow:0 6px 16px rgba(22,23,26,.18);
}
.hero-sun{
  width:84px; height:84px; margin:16px auto 0; border-radius:50%; background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:46px; line-height:1;
  box-shadow:0 8px 20px rgba(22,23,26,.25); transform:rotate(-6deg);
}
.hero-title{
  margin:14px auto 0; max-width:520px;
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(30px,8.6vw,46px); line-height:1.08;
  text-shadow:0 3px 0 rgba(0,0,0,.18);
}
.hero-title .hl{
  display:inline-block; margin-top:6px; background:var(--gold); color:var(--ink); padding:0 14px; border-radius:14px;
  transform:rotate(-2deg); text-shadow:none; box-shadow:0 6px 16px rgba(22,23,26,.18);
}
.hero-sub{margin:14px auto 0; max-width:430px; font-size:17px; font-weight:500; opacity:.96;}

/* ===== conteúdo ===== */
.wrap{max-width:600px; margin:0 auto; padding:6px 18px 8px; display:flex; flex-direction:column; gap:22px;}
.section-title{
  margin:6px 0 0; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(26px,7.4vw,36px); line-height:1.1; text-align:center;
}
.section-title span{background:linear-gradient(transparent 62%, var(--gold) 62%); padding:0 6px;}
.section-sub{margin:-12px 0 0; text-align:center; color:var(--muted); font-size:16px; font-weight:500;}

/* ===== temas ===== */
.themes{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (min-width:540px){ .themes{grid-template-columns:repeat(4,1fr);} }
.theme{
  position:relative; margin:0; cursor:pointer; font:inherit; color:inherit; text-align:center;
  background:#fff; border:0; border-radius:22px; padding:18px 10px 14px;
  box-shadow:0 6px 16px rgba(22,23,26,.14);
  transition:transform .12s ease, box-shadow .12s ease; -webkit-tap-highlight-color:transparent;
}
.theme .em{
  display:flex; align-items:center; justify-content:center; width:64px; height:64px; margin:0 auto 8px;
  border-radius:50%; font-size:34px; line-height:1; background:var(--bg,#eee);
}
.theme .nm{display:block; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:21px; line-height:1.1;}
.theme .ds{display:block; margin-top:3px; font-size:13.5px; line-height:1.3; color:var(--muted); font-weight:500;}
.theme:last-child{grid-column:1/-1;}
.theme:hover{transform:translateY(-3px);}
.theme:active{transform:scale(.97);}
.theme:focus-visible{outline:4px solid var(--blue); outline-offset:3px;}
.theme-check{
  position:absolute; right:-8px; top:-10px; width:34px; height:34px; border-radius:50%;
  background:var(--pop); color:#fff; font-weight:800; font-size:19px; border:3px solid #fff;
  display:none; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.theme.selected{box-shadow:0 0 0 4px var(--pop), 0 8px 18px rgba(22,23,26,.18); transform:translateY(-2px);}
.theme.selected .theme-check{display:flex;}
.pick-status{
  text-align:center; min-height:26px; margin-top:16px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; color:var(--muted);
}
.pick-status.chosen{color:var(--pop); font-weight:800;}
.themes-wrap.nudge .themes{animation:nudge .5s ease;}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== como funciona ===== */
.bubble{background:#fff; border-radius:22px; padding:18px 20px; box-shadow:0 6px 16px rgba(22,23,26,.14);}
.bubble-title{margin:0 0 6px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:24px; line-height:1.15;}
.steps{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:12px;}
.steps li{display:flex; gap:12px; align-items:flex-start; font-size:16.5px; color:#2B2F36;}
.steps .n{
  flex:0 0 auto; width:32px; height:32px; border-radius:50%; background:var(--pop); color:#fff;
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:17px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(22,23,26,.18);
}

/* ===== botão fixo no topo ===== */
.cta-bar{
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  width:calc(100% - 20px); max-width:560px; z-index:50; animation:ctaIn .4s cubic-bezier(.2,1.4,.4,1);
}
.cta-bar[hidden]{display:none;}
@keyframes ctaIn{from{opacity:0; transform:translateX(-50%) translateY(-24px) scale(.96)}to{opacity:1; transform:translateX(-50%)}}
#verseLink{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  text-decoration:none; text-align:center; color:#fff;
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(17px,4.8vw,21px); line-height:1.2;
  padding:15px 18px; border-radius:18px; background:var(--pop);
  box-shadow:0 6px 16px rgba(22,23,26,.18); animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
#verseLink:hover{filter:brightness(1.06);}
#verseLink svg{flex:0 0 auto; width:24px; height:24px;}
.cta-hl{background:var(--gold); color:var(--ink); padding:0 8px; border-radius:8px; box-decoration-break:clone; -webkit-box-decoration-break:clone;}
.cta-note{
  margin:10px 6px 0; padding:9px 14px; text-align:center; font-size:14.5px; line-height:1.4; color:#2B2F36;
  background:#fff; border-radius:14px; box-shadow:0 6px 16px rgba(22,23,26,.18); font-weight:500;
}
.cta-note b{color:var(--blue-dark); font-weight:800;}
body.cta-open{padding-top:var(--cta-space,110px);}

/* ===== rodapé ===== */
.site-footer{margin:14px auto 40px; text-align:center;}
.site-footer span{
  display:inline-block; background:#fff; border-radius:999px; padding:6px 16px;
  font-size:13px; font-weight:700; color:var(--muted); box-shadow:0 6px 16px rgba(22,23,26,.18);
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} html{scroll-behavior:auto;} }
</style>
</head>
<body>

<header class="hero">
  <span class="hero-brand">Ateliê15</span>
  <div class="hero-sun" aria-hidden="true">☀️</div>
  <h1 class="hero-title">Receba a sua <span class="hl">mensagem do dia</span></h1>
</header>

<main class="wrap">

  <h2 class="section-title">Qual <span>tema</span> você quer hoje?</h2>
  <p class="section-sub">Toque em um tema para escolher.</p>

  <section class="themes-wrap" id="themesWrap">
    <div class="themes" role="group" aria-label="Temas da mensagem do dia">
      <button type="button" class="theme" data-tema="Fé" style="--bg:#DDEBFF"><span class="em" aria-hidden="true">🙏</span><span class="nm">Fé</span><span class="ds">confiança em Deus</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="Amor" style="--bg:#FFE0EF"><span class="em" aria-hidden="true">❤️</span><span class="nm">Amor</span><span class="ds">carinho e cuidado</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="Gratidão" style="--bg:#FFF0B8"><span class="em" aria-hidden="true">🌻</span><span class="nm">Gratidão</span><span class="ds">agradecer o dia</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="Força" style="--bg:#FFE2C4"><span class="em" aria-hidden="true">💪</span><span class="nm">Força</span><span class="ds">ânimo para seguir</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="Paz" style="--bg:#D5F5E6"><span class="em" aria-hidden="true">🕊️</span><span class="nm">Paz</span><span class="ds">calma no coração</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="Esperança" style="--bg:#D6EEFF"><span class="em" aria-hidden="true">🌈</span><span class="nm">Esperança</span><span class="ds">dias melhores</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="Família" style="--bg:#FFD9D4"><span class="em" aria-hidden="true">🏡</span><span class="nm">Família</span><span class="ds">união em casa</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="MPB" style="--bg:#FFE9C7"><span class="em" aria-hidden="true">🎶</span><span class="nm">MPB</span><span class="ds">música brasileira</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme" data-tema="Surpresa" style="--bg:#E6DCFF"><span class="em" aria-hidden="true">✨</span><span class="nm">Surpresa</span><span class="ds">nós escolhemos por você</span><span class="theme-check" aria-hidden="true">✓</span></button>
    </div>
    <div class="pick-status" id="pickStatus" aria-live="polite">Escolha um tema para continuar</div>
  </section>


</main>

<div class="cta-bar" id="ctaBar" hidden>
  <a id="verseLink" href="#">
    <span id="ctaText">Clique aqui e receba a sua mensagem do dia!</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </a>
  <p class="cta-note">Você será direcionado(a) para o <b>WhatsApp do Ateliê15</b> (<span class="wa-num"></span>) e receberá a sua <b>mensagem do dia</b>.</p>
</div>

<p class="site-footer"><span>CNPJ: 23.599.519/0001-33</span></p>

<script>
/* =========================================================
   TROQUE AQUI: seu número de WhatsApp (código do país + DDD + número, só dígitos)
   Ex: 55 (Brasil) + 11 (DDD) + 999999999
========================================================= */
const WHATSAPP_NUMBER = "5577991738963";

/* mostra o número na página (formatado) */
(function(){
  const n = WHATSAPP_NUMBER;
  const fmt = '+' + n.slice(0,2) + ' ' + n.slice(2,4) + ' ' + n.slice(4,n.length-4) + '-' + n.slice(-4);
  document.querySelectorAll('.wa-num').forEach(el=>{ el.textContent = fmt; });
})();

const verseLink = document.getElementById('verseLink');
const ctaBar = document.getElementById('ctaBar');
const themesWrap = document.getElementById('themesWrap');
const pickStatus = document.getElementById('pickStatus');

/* Google Analytics: registra os eventos (nunca dados pessoais) */
function evento(nome, params){
  try{ if(typeof gtag === 'function') gtag('event', nome, params || {}); }catch(e){}
}

let tema = null;   // tema escolhido pela pessoa
const nomeTema = t => (t === 'MPB') ? 'MPB' : t.toLowerCase();   // MPB sempre em maiúsculas

function atualizar(){
  document.querySelectorAll('.theme').forEach(b=>{
    const on = b.dataset.tema === tema;
    b.classList.toggle('selected', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  if(!tema){
    pickStatus.textContent = 'Escolha um tema para continuar';
    pickStatus.classList.remove('chosen');
    if(!ctaBar.hidden){
      ctaBar.hidden = true;
      if(document.body.classList.contains('cta-open')){
        const space = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
        document.body.classList.remove('cta-open');
        if(window.scrollY > 0) window.scrollBy(0, -space);
      }
    }
    return;
  }
  pickStatus.classList.add('chosen');
  pickStatus.textContent = tema === 'Surpresa'
    ? 'Você escolheu: surpresa! Nós escolhemos o tema por você.'
    : 'Você escolheu o tema: ' + tema;
  if(ctaBar.hidden){
    ctaBar.hidden = false;
    if(!document.body.classList.contains('cta-open')){
      const space = ctaBar.offsetHeight + 28;
      document.documentElement.style.setProperty('--cta-space', space + 'px');
      document.body.classList.add('cta-open');
      if(window.scrollY > 0) window.scrollBy(0, space);
    }
  }
  document.getElementById('ctaText').innerHTML = tema === 'Surpresa'
    ? 'Clique aqui e receba a sua <mark class="cta-hl">mensagem do dia</mark> surpresa!'
    : 'Clique aqui e receba a sua <mark class="cta-hl">mensagem do dia</mark> sobre ' + nomeTema(tema) + '!';
}

document.querySelectorAll('.theme').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const t = btn.dataset.tema;
    if(tema === t){
      tema = null;                       // toca de novo = desmarca
    } else {
      tema = t;                          // escolher outro troca a escolha
      evento('escolheu_tema', {tema: t});
    }
    atualizar();
  });
});

function ir(e){
  if(e) e.preventDefault();
  if(!tema){
    themesWrap.scrollIntoView({behavior:'smooth', block:'center'});
    themesWrap.classList.remove('nudge'); void themesWrap.offsetWidth; themesWrap.classList.add('nudge');
    pickStatus.textContent = 'Primeiro escolha um tema da lista';
    return;
  }
  const msg = tema === 'Surpresa'
    ? "Oi! Quero receber a minha mensagem do dia. Podem escolher o tema para mim!"
    : "Oi! Quero receber a minha mensagem do dia sobre " + nomeTema(tema) + ".";
  evento('clique_whatsapp', {tema: tema});
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
}
verseLink.href = "#";
verseLink.addEventListener('click', ir);
</script>
</body>
</html>
