<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Google Analytics (GA4) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasta de Figurinhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBF3E6;
    --paper-dark: #F1E4CE;
    --ink: #26221C;
    --whats: #23B26D;
    --pop: #FF6A45;
    --sky: #4E8FD1;
    --line: rgba(38,34,28,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(38,34,28,0.07) 1px, transparent 1px) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }

  header{
    padding:38px 20px 22px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--whats);
    font-weight:500;
    display:inline-block;
    border:1.5px dashed var(--whats);
    padding:4px 12px;
    border-radius:100px;
    margin-bottom:14px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(32px,7vw,52px);
    margin:0 0 8px;
    line-height:1;
    transform:rotate(-1deg);
  }
  h1 span{color:var(--pop);}
  header p{
    font-size:15px;
    color:rgba(38,34,28,0.65);
    max-width:420px;
    margin:0 auto;
  }

  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}

  .cat-nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 4px 26px;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    white-space:nowrap;
    padding:8px 16px;
    border-radius:100px;
    border:1.5px solid var(--ink);
    background:transparent;
    cursor:pointer;
    flex:0 0 auto;
    transition:all .15s ease;
  }
  .cat-btn.active{background:var(--ink);color:var(--paper);}

  .sheet{
    background:#fff;
    border-radius:18px;
    padding:22px 18px 26px;
    box-shadow:0 2px 0 var(--line), 0 14px 30px -20px rgba(38,34,28,0.35);
    margin-bottom:34px;
    position:relative;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0;left:24px;right:24px;
    height:1px;
    background-image:linear-gradient(to right, var(--line) 60%, transparent 0%);
    background-size:10px 1px;
    background-repeat:repeat-x;
  }
  .sheet-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    margin:2px 0 16px 4px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .sheet-title small{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:500;
    color:rgba(38,34,28,0.45);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(108px,1fr));
    gap:14px;
  }

  .sticker{
    cursor:pointer;
    border:none;
    background:transparent;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .disc{
    width:100%;
    aspect-ratio:1;
    border-radius:14px;
    background:var(--paper-dark);
    border:3px solid #fff;
    outline:2.5px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:44px;
    position:relative;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), outline-color .15s ease, background .15s ease;
  }
  .sticker:hover .disc{transform:translateY(-3px) rotate(-3deg);}
  .sticker.selected .disc{
    outline-color:var(--whats);
    background:#E9FBF2;
    transform:scale(1.05) rotate(3deg);
  }
  .sticker.selected .disc::after{
    content:"✓";
    position:absolute;
    top:-6px; right:-6px;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--whats);
    color:#fff;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
    border:2.5px solid #fff;
    font-weight:700;
  }
  .sticker-name{
    font-size:12.5px;
    font-weight:500;
    text-align:center;
    line-height:1.2;
  }
  .sticker-price{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:rgba(38,34,28,0.5);
  }

  /* figurinha em destaque (ex: grátis) */
  .sticker.featured .disc{
    outline:3px solid var(--pop);
    box-shadow:0 0 0 5px rgba(255,106,69,0.18), 0 6px 18px -6px rgba(255,106,69,0.55);
    animation:featured-pulse 1.8s ease-in-out infinite;
  }
  .sticker.featured.selected .disc{outline-color:var(--whats);}
  .featured-badge{
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%);
    background:var(--pop);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:9.5px;
    letter-spacing:.03em;
    padding:2px 8px;
    border-radius:100px;
    border:2px solid #fff;
    white-space:nowrap;
    z-index:2;
  }
  .sticker.featured .sticker-price{
    color:var(--pop);
    font-weight:700;
  }
  @keyframes featured-pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.04);}
  }

  /* seção de figurinha personalizada */
  .custom-sheet{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    align-items:center;
  }
  #customCanvas{
    width:150px;
    height:150px;
    border-radius:14px;
    border:3px solid #fff;
    outline:2.5px solid var(--ink);
    background:var(--paper-dark);
    flex:0 0 auto;
  }
  .custom-form{
    flex:1;
    min-width:200px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .custom-form label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:rgba(38,34,28,0.6);
  }
  .custom-form input{
    font-family:'DM Sans', sans-serif;
    font-size:15px;
    padding:11px 14px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:#fff;
    outline:none;
  }
  .custom-form input:focus{border-color:var(--pop);}
  .custom-add-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14.5px;
    background:var(--pop);
    color:#fff;
    border:none;
    padding:11px 18px;
    border-radius:100px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .custom-add-btn:hover{filter:brightness(1.08);}
  .custom-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:rgba(38,34,28,0.45);
  }

  /* cart pocket */
  .pocket{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    box-shadow:0 -12px 30px -14px rgba(0,0,0,0.4);
    z-index:20;
  }
  .pocket-info{display:flex;align-items:center;gap:12px;}
  .pocket-stack{
    display:flex;
  }
  .pocket-stack span{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--paper-dark);
    border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    margin-left:-12px;
  }
  .pocket-stack span:first-child{margin-left:0;}
  .pocket-text{font-family:'IBM Plex Mono', monospace;font-size:12px;line-height:1.4;}
  .pocket-text b{font-family:'Baloo 2',sans-serif;font-size:16px;color:#fff;display:block;}
  .send-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    background:var(--whats);
    color:#fff;
    border:none;
    padding:13px 20px;
    border-radius:100px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:filter .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .send-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .send-btn:disabled{background:#5a5850;cursor:not-allowed;transform:none;filter:none;}

  @media (max-width:520px){
    .pocket{flex-direction:column;align-items:stretch;}
    .send-btn{justify-content:center;}
  }

  .empty-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    opacity:.55;
  }

  /* letreiro promocional */
  .marquee-bar{
    background:var(--pop);
    color:#fff;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    padding:9px 0;
  }
  .marquee-track{
    display:inline-block;
    padding-left:100%;
    animation:marquee-scroll 16s linear infinite;
  }
  .marquee-track span{
    display:inline-block;
    padding:0 40px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
  }
  @keyframes marquee-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">coleção Lula • pronta entrega</div>
  <h1>Monta sua <span>pasta</span><br>de figurinhas</h1>
  <p>Escolhe as figurinhas que quiser da coleção, depois é só mandar o pedido no zap que a gente confirma o pagamento e envia. 🎉</p>
</header>

<div class="wrap">
  <div class="cat-nav" id="catNav"></div>
  <div id="sheets"></div>

  <div class="sheet custom-sheet">
    <canvas id="customCanvas" width="220" height="220"></canvas>
    <div class="custom-form">
      <div class="sheet-title" style="margin:0;">Crie a sua <small>com a sua profissão</small></div>
      <label for="professionInput">Digite sua profissão</label>
      <input id="professionInput" type="text" placeholder="Ex: Advogado(a), Professor(a)..." maxlength="24">
      <button class="custom-add-btn" id="addCustomBtn">Adicionar ao pedido — R$ 5,15</button>
      <span class="custom-hint">Baseada na figurinha 010</span>
    </div>
  </div>
</div>

<div class="pocket">
  <div class="pocket-info">
    <div class="pocket-stack" id="pocketStack"></div>
    <div class="pocket-text" id="pocketText">
      <span class="empty-hint">nenhuma figurinha ainda</span>
    </div>
  </div>
  <button class="send-btn" id="sendBtn" disabled>
    Enviar pedido no WhatsApp →
  </button>
</div>

<script>
/* =========================================================
   TROQUE AQUI: seu número de WhatsApp (código do país + DDD + número, só dígitos)
   Ex: 55 (Brasil) + 11 (DDD) + 999999999
========================================================= */
const WHATSAPP_NUMBER = "557791629907";
const PRICE = 1.5; // preço por figurinha, em R$

/* Cada figurinha pode ter "emoji" (placeholder) OU "img" (imagem real, em
   base64 ou URL). Se "price" não for definido no item, usa o PRICE padrão. */
const STICKERS = [
  {id:19, img:"images/011.gif", name:"011", cat:"Lula", price:0, featured:true},
  {id:18, img:"images/010.gif", name:"010", cat:"Lula", price:4.13},
  {id:17, img:"images/009.png", name:"009", cat:"Lula", price:1.13},
  {id:16, img:"images/008.gif", name:"008", cat:"Lula", price:3.13},
  {id:15, img:"images/007.gif", name:"007", cat:"Lula", price:3.13},
  {id:14, img:"images/006.gif", name:"006", cat:"Lula", price:3.13},
  {id:13, img:"images/005.gif", name:"005", cat:"Lula", price:3.13},
  {id:12, img:"images/004.gif", name:"004", cat:"Lula", price:3.13},
  {id:11, img:"images/003.png", name:"003", cat:"Lula", price:2.13},
  {id:10, img:"images/002.gif", name:"002", cat:"Lula", price:3.13},
  {id:9, img:"images/001.png", name:"001", cat:"Lula", price:1.13},
];

const cats = ["Todas", ...new Set(STICKERS.map(s=>s.cat))];
let activeCat = "Todas";
let selected = new Set();

/* ---------- figurinha personalizada (profissão) ---------- */
const CUSTOM_BASE_IMG = "images/010.gif";
const CUSTOM_PRICE = 5.15;
let customOrders = []; // {id, profession, price}
let customIdCounter = 1;
let customBaseImgEl = null;

function drawCustomPreview(){
  const canvas = document.getElementById('customCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const render = ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(customBaseImgEl,0,0,canvas.width,canvas.height);
    const profession = document.getElementById('professionInput').value.trim();
    if(profession){
      const label = profession.toUpperCase();
      let fontSize = 24;
      ctx.font = `bold ${fontSize}px 'Baloo 2', sans-serif`;
      while(ctx.measureText(label).width > canvas.width - 24 && fontSize > 12){
        fontSize -= 1;
        ctx.font = `bold ${fontSize}px 'Baloo 2', sans-serif`;
      }
      const bannerHeight = fontSize + 18;
      const bannerY = canvas.height - bannerHeight - 10;
      ctx.fillStyle = "#FF6A45";
      ctx.fillRect(10, bannerY, canvas.width - 20, bannerHeight);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, canvas.width/2, bannerY + bannerHeight/2 + 1);
    }
  };
  if(customBaseImgEl){ render(); return; }
  customBaseImgEl = new Image();
  customBaseImgEl.onload = render;
  customBaseImgEl.src = CUSTOM_BASE_IMG;
}

function initCustomSticker(){
  const input = document.getElementById('professionInput');
  const btn = document.getElementById('addCustomBtn');
  input.addEventListener('input', drawCustomPreview);
  btn.onclick = ()=>{
    const profession = input.value.trim();
    if(!profession){
      input.focus();
      input.style.borderColor = '#e0433a';
      setTimeout(()=>{ input.style.borderColor = ''; }, 900);
      return;
    }
    customOrders.push({id: 'custom-'+(customIdCounter++), profession, price: CUSTOM_PRICE});
    input.value = "";
    drawCustomPreview();
    renderPocket();
  };
  drawCustomPreview();
}

function renderNav(){
  const nav = document.getElementById("catNav");
  if(cats.length <= 2){ nav.style.display = "none"; return; } // só 1 categoria real -> sem nav
  nav.innerHTML = cats.map(c =>
    `<button class="cat-btn ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`
  ).join("");
  nav.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.onclick = ()=>{ activeCat = btn.dataset.cat; renderNav(); renderSheets(); };
  });
}

function renderSheets(){
  const groups = activeCat === "Todas"
    ? cats.slice(1)
    : [activeCat];

  document.getElementById("sheets").innerHTML = groups.map(cat=>{
    const items = STICKERS.filter(s=>s.cat===cat);
    return `
    <div class="sheet">
      <div class="sheet-title">${cat} <small>${items.length} figurinhas</small></div>
      <div class="grid">
        ${items.map(s=>{
          const visual = s.img
            ? `<img src="${s.img}" alt="${s.name}" style="width:100%;height:100%;object-fit:cover;border-radius:11px;">`
            : s.emoji;
          const price = (s.price ?? PRICE);
          const priceLabel = price === 0 ? "GRÁTIS" : `R$ ${price.toFixed(2).replace('.',',')}`;
          const featuredClass = s.featured ? ' featured' : '';
          const badge = s.featured ? `<div class="featured-badge">⭐ destaque</div>` : '';
          return `
          <button class="sticker${featuredClass} ${selected.has(s.id)?'selected':''}" data-id="${s.id}">
            <div class="disc">${badge}${visual}</div>
            <div class="sticker-name">${s.name}</div>
            <div class="sticker-price">${priceLabel}</div>
          </button>
        `;}).join("")}
      </div>
    </div>`;
  }).join("");

  document.querySelectorAll(".sticker").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.id);
      selected.has(id) ? selected.delete(id) : selected.add(id);
      renderSheets();
      renderPocket();
    };
  });
}

function renderPocket(){
  const stack = document.getElementById("pocketStack");
  const text = document.getElementById("pocketText");
  const sendBtn = document.getElementById("sendBtn");
  const chosen = STICKERS.filter(s=>selected.has(s.id));
  const totalCount = chosen.length + customOrders.length;

  if(totalCount === 0){
    stack.innerHTML = "";
    text.innerHTML = `<span class="empty-hint">nenhuma figurinha ainda</span>`;
    sendBtn.disabled = true;
    return;
  }

  const stackItems = [
    ...chosen.map(s=>s.img ? `<span><img src="${s.img}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;"></span>` : `<span>${s.emoji}</span>`),
    ...customOrders.map(()=>`<span>🎨</span>`)
  ];
  stack.innerHTML = stackItems.slice(-4).join("");

  const stickerTotal = chosen.reduce((sum,s)=>sum+(s.price ?? PRICE),0);
  const customTotal = customOrders.reduce((sum,c)=>sum+c.price,0);
  const total = (stickerTotal + customTotal).toFixed(2).replace('.',',');
  text.innerHTML = `${totalCount} figurinha${totalCount>1?'s':''}<b>R$ ${total}</b>`;
  sendBtn.disabled = false;
}

document.getElementById("sendBtn").onclick = ()=>{
  const chosen = STICKERS.filter(s=>selected.has(s.id));
  const totalCount = chosen.length + customOrders.length;
  if(totalCount === 0) return;

  const stickerTotal = chosen.reduce((sum,s)=>sum+(s.price ?? PRICE),0);
  const customTotal = customOrders.reduce((sum,c)=>sum+c.price,0);
  const total = (stickerTotal + customTotal).toFixed(2).replace('.',',');

  const listaNormais = chosen.map((s,i)=>`${i+1}. ${s.img ? '🖼️' : s.emoji} ${s.name}`);
  const listaCustom = customOrders.map((c,i)=>`${listaNormais.length+i+1}. 🎨 Personalizada (profissão: ${c.profession}) - R$ ${c.price.toFixed(2).replace('.',',')}`);
  const lista = [...listaNormais, ...listaCustom].join("\n");

  const msg =
`Oi! Quero pedir essas figurinhas:

${lista}

Total: ${totalCount} figurinhas - R$ ${total}`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
};

renderNav();
renderSheets();
renderPocket();
initCustomSticker();
</script>
</body>
</html>
