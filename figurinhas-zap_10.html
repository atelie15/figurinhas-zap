<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasta de Figurinhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBF3E6;
    --paper-dark: #F1E4CE;
    --ink: #26221C;
    --whats: #23B26D;
    --pop: #FF6A45;
    --sky: #4E8FD1;
    --line: rgba(38,34,28,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(38,34,28,0.07) 1px, transparent 1px) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }

  header{
    padding:38px 20px 22px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--whats);
    font-weight:500;
    display:inline-block;
    border:1.5px dashed var(--whats);
    padding:4px 12px;
    border-radius:100px;
    margin-bottom:14px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(32px,7vw,52px);
    margin:0 0 8px;
    line-height:1;
    transform:rotate(-1deg);
  }
  h1 span{color:var(--pop);}
  header p{
    font-size:15px;
    color:rgba(38,34,28,0.65);
    max-width:420px;
    margin:0 auto;
  }

  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}

  .cat-nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 4px 26px;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    white-space:nowrap;
    padding:8px 16px;
    border-radius:100px;
    border:1.5px solid var(--ink);
    background:transparent;
    cursor:pointer;
    flex:0 0 auto;
    transition:all .15s ease;
  }
  .cat-btn.active{background:var(--ink);color:var(--paper);}

  .sheet{
    background:#fff;
    border-radius:18px;
    padding:22px 18px 26px;
    box-shadow:0 2px 0 var(--line), 0 14px 30px -20px rgba(38,34,28,0.35);
    margin-bottom:34px;
    position:relative;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0;left:24px;right:24px;
    height:1px;
    background-image:linear-gradient(to right, var(--line) 60%, transparent 0%);
    background-size:10px 1px;
    background-repeat:repeat-x;
  }
  .sheet-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    margin:2px 0 16px 4px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .sheet-title small{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:500;
    color:rgba(38,34,28,0.45);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(108px,1fr));
    gap:14px;
  }

  .sticker{
    cursor:pointer;
    border:none;
    background:transparent;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .disc{
    width:100%;
    aspect-ratio:1;
    border-radius:14px;
    background:var(--paper-dark);
    border:3px solid #fff;
    outline:2.5px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:44px;
    position:relative;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), outline-color .15s ease, background .15s ease;
  }
  .sticker:hover .disc{transform:translateY(-3px) rotate(-3deg);}
  .sticker.selected .disc{
    outline-color:var(--whats);
    background:#E9FBF2;
    transform:scale(1.05) rotate(3deg);
  }
  .sticker.selected .disc::after{
    content:"✓";
    position:absolute;
    top:-6px; right:-6px;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--whats);
    color:#fff;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
    border:2.5px solid #fff;
    font-weight:700;
  }
  .sticker-name{
    font-size:12.5px;
    font-weight:500;
    text-align:center;
    line-height:1.2;
  }
  .sticker-price{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:rgba(38,34,28,0.5);
  }

  /* cart pocket */
  .pocket{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    box-shadow:0 -12px 30px -14px rgba(0,0,0,0.4);
    z-index:20;
  }
  .pocket-info{display:flex;align-items:center;gap:12px;}
  .pocket-stack{
    display:flex;
  }
  .pocket-stack span{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--paper-dark);
    border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    margin-left:-12px;
  }
  .pocket-stack span:first-child{margin-left:0;}
  .pocket-text{font-family:'IBM Plex Mono', monospace;font-size:12px;line-height:1.4;}
  .pocket-text b{font-family:'Baloo 2',sans-serif;font-size:16px;color:#fff;display:block;}
  .send-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    background:var(--whats);
    color:#fff;
    border:none;
    padding:13px 20px;
    border-radius:100px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:filter .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .send-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .send-btn:disabled{background:#5a5850;cursor:not-allowed;transform:none;filter:none;}

  @media (max-width:520px){
    .pocket{flex-direction:column;align-items:stretch;}
    .send-btn{justify-content:center;}
  }

  .empty-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    opacity:.55;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">coleção Lula • pronta entrega</div>
  <h1>Monta sua <span>pasta</span><br>de figurinhas</h1>
  <p>Escolhe as figurinhas que quiser da coleção, depois é só mandar o pedido no zap que a gente confirma o pagamento e envia. 🎉</p>
</header>

<div class="wrap">
  <div class="cat-nav" id="catNav"></div>
  <div id="sheets"></div>
</div>

<div class="pocket">
  <div class="pocket-info">
    <div class="pocket-stack" id="pocketStack"></div>
    <div class="pocket-text" id="pocketText">
      <span class="empty-hint">nenhuma figurinha ainda</span>
    </div>
  </div>
  <button class="send-btn" id="sendBtn" disabled>
    Enviar pedido no WhatsApp →
  </button>
</div>

const cats = ["Todas", ...new Set(STICKERS.map(s=>s.cat))];
let activeCat = "Todas";
let selected = new Set();

function renderNav(){
  const nav = document.getElementById("catNav");
  if(cats.length <= 2){ nav.style.display = "none"; return; } // só 1 categoria real -> sem nav
  nav.innerHTML = cats.map(c =>
    `<button class="cat-btn ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`
  ).join("");
  nav.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.onclick = ()=>{ activeCat = btn.dataset.cat; renderNav(); renderSheets(); };
  });
}

function renderSheets(){
  const groups = activeCat === "Todas"
    ? cats.slice(1)
    : [activeCat];

  document.getElementById("sheets").innerHTML = groups.map(cat=>{
    const items = STICKERS.filter(s=>s.cat===cat);
    return `
    <div class="sheet">
      <div class="sheet-title">${cat} <small>${items.length} figurinhas</small></div>
      <div class="grid">
        ${items.map(s=>{
          const visual = s.img
            ? `<img src="${s.img}" alt="${s.name}" style="width:100%;height:100%;object-fit:cover;border-radius:11px;">`
            : s.emoji;
          const price = (s.price ?? PRICE);
          return `
          <button class="sticker ${selected.has(s.id)?'selected':''}" data-id="${s.id}">
            <div class="disc">${visual}</div>
            <div class="sticker-name">${s.name}</div>
            <div class="sticker-price">R$ ${price.toFixed(2).replace('.',',')}</div>
          </button>
        `;}).join("")}
      </div>
    </div>`;
  }).join("");

  document.querySelectorAll(".sticker").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.id);
      selected.has(id) ? selected.delete(id) : selected.add(id);
      renderSheets();
      renderPocket();
    };
  });
}

function renderPocket(){
  const stack = document.getElementById("pocketStack");
  const text = document.getElementById("pocketText");
  const sendBtn = document.getElementById("sendBtn");
  const chosen = STICKERS.filter(s=>selected.has(s.id));

  if(chosen.length === 0){
    stack.innerHTML = "";
    text.innerHTML = `<span class="empty-hint">nenhuma figurinha ainda</span>`;
    sendBtn.disabled = true;
    return;
  }

  stack.innerHTML = chosen.slice(-4).map(s=>s.img ? `<span><img src="${s.img}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;"></span>` : `<span>${s.emoji}</span>`).join("");
  const total = chosen.reduce((sum,s)=>sum+(s.price ?? PRICE),0).toFixed(2).replace('.',',');
  text.innerHTML = `${chosen.length} figurinha${chosen.length>1?'s':''}<b>R$ ${total}</b>`;
  sendBtn.disabled = false;
}

document.getElementById("sendBtn").onclick = ()=>{
  const chosen = STICKERS.filter(s=>selected.has(s.id));
  if(chosen.length === 0) return;
  const total = chosen.reduce((sum,s)=>sum+(s.price ?? PRICE),0).toFixed(2).replace('.',',');
  const lista = chosen.map((s,i)=>`${i+1}. ${s.img ? '🖼️' : s.emoji} ${s.name}`).join("\n");
  const msg =
`Oi! Quero pedir essas figurinhas:

${lista}

Total: ${chosen.length} figurinhas - R$ ${total}`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
};

renderNav();
renderSheets();
renderPocket();
</script>
</body>
</html>
